services:
  postgres:
    image: postgres:17-alpine
    container_name: image-gallery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: image_gallery
    # Host port 5436: 5432 is commonly taken by a native Postgres install.
    ports:
      - '5436:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d image_gallery']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for Cloudflare R2, which is S3-compatible. Lets a clone run the
  # whole pipeline — upload, seed, thumbnails — without a Cloudflare account.
  # Production still points at the real R2 via the same env vars.
  minio:
    image: minio/minio:latest
    container_name: image-gallery-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
