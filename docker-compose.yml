services:
  postgres:
    image: postgres:17-alpine
    container_name: image-gallery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: image_gallery
    # Host port 5436: 5432 is commonly taken by a native Postgres install.
    ports:
      - '5436:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d image_gallery']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
